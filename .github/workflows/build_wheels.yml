name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_target:
        description: 'Upload destination'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
          - none

jobs:
  # ============================================================
  # Linux GPU wheels (CUDA 12.4, manylinux_2_28)
  # ============================================================
  linux-gpu:
    name: Linux GPU - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-rockylinux8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y gcc gcc-c++ make wget openblas-devel lapack-devel \
                         numactl-devel bzip2 zlib-devel libffi-devel \
                         openssl-devel sqlite-devel

      - name: Install Miniconda and Python ${{ matrix.python-version }}
        run: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p /opt/miniconda
          export PATH="/opt/miniconda/bin:$PATH"
          conda create -y -n build python=${{ matrix.python-version }}
          echo "/opt/miniconda/envs/build/bin" >> $GITHUB_PATH
          echo "/opt/miniconda/bin" >> $GITHUB_PATH

      - name: Install Python build tools
        run: |
          export PATH="/opt/miniconda/envs/build/bin:/opt/miniconda/bin:$PATH"
          pip install --upgrade pip setuptools wheel pybind11 numpy auditwheel

      - name: Install CMake
        run: |
          export PATH="/opt/miniconda/envs/build/bin:/opt/miniconda/bin:$PATH"
          pip install cmake

      - name: Build GPU wheel
        run: |
          export PATH="/opt/miniconda/envs/build/bin:/opt/miniconda/bin:$PATH"
          export RFX_CUDA_STATIC=1
          pip wheel . --no-deps -w wheelhouse/

      - name: Repair wheel
        run: |
          export PATH="/opt/miniconda/envs/build/bin:/opt/miniconda/bin:$PATH"
          pip install wheel
          mkdir -p dist/
          for whl in wheelhouse/*.whl; do
            if ! auditwheel repair "$whl" -w dist/ --plat manylinux_2_28_x86_64 2>/dev/null; then
              python -m wheel tags --platform-tag manylinux_2_28_x86_64 --remove "$whl"
              cp wheelhouse/*.whl dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-gpu-py${{ matrix.python-version }}
          path: dist/*.whl

  # ============================================================
  # Linux CPU wheels (manylinux_2_28)
  # ============================================================
  linux-cpu:
    name: Linux CPU - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        include:
          - python-version: '3.11'
            python-bin: /opt/python/cp311-cp311/bin
          - python-version: '3.12'
            python-bin: /opt/python/cp312-cp312/bin
          - python-version: '3.13'
            python-bin: /opt/python/cp313-cp313/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          yum install -y epel-release || true
          yum config-manager --set-enabled powertools || true
          yum install -y openblas-devel lapack-devel numactl-devel || \
            yum install -y lapack-devel numactl-devel

      - name: Install Python build tools
        run: |
          ${{ matrix.python-bin }}/pip install --upgrade pip setuptools wheel pybind11 numpy cmake

      - name: Build CPU wheel
        run: |
          export RFX_CPU_ONLY=1
          ${{ matrix.python-bin }}/pip wheel . --no-deps -w wheelhouse/

      - name: Repair wheel
        run: |
          ${{ matrix.python-bin }}/pip install wheel
          mkdir -p dist/
          for whl in wheelhouse/*.whl; do
            if ! auditwheel repair "$whl" -w dist/ --plat manylinux_2_28_x86_64 2>/dev/null; then
              ${{ matrix.python-bin }}/python -m wheel tags --platform-tag manylinux_2_28_x86_64 --remove "$whl"
              cp wheelhouse/*.whl dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-cpu-py${{ matrix.python-version }}
          path: dist/*.whl

  # ============================================================
  # Windows GPU wheels (CUDA 12.4)
  # ============================================================
  windows-gpu:
    name: Windows GPU - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Install Python build tools
        run: pip install --upgrade pip setuptools wheel pybind11 numpy cmake delvewheel

      - name: Build GPU wheel
        env:
          RFX_CUDA_STATIC: '1'
        run: pip wheel . --no-deps -w wheelhouse/

      - name: Repair wheel (exclude CUDA DLLs — users must have CUDA installed)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $cudaExclude = "cudart64_*;cublas64_*;cublasLt64_*;cusolver64_*;cusparse64_*;cufft64_*;cufftw64_*;curand64_*;nvrtc64_*;nvJitLink*;nvcuda*;nvToolsExt*;cudnn*;nvfatbin*;nvvm64_*"
          foreach ($whl in Get-ChildItem wheelhouse/*.whl) {
            try {
              delvewheel repair $whl.FullName -w dist/ --no-dll $cudaExclude
            } catch {
              Copy-Item $whl.FullName dist/
            }
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-gpu-py${{ matrix.python-version }}
          path: dist/*.whl

  # ============================================================
  # Windows CPU wheels
  # ============================================================
  windows-cpu:
    name: Windows CPU - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build tools
        run: pip install --upgrade pip setuptools wheel pybind11 numpy cmake delvewheel

      - name: Build CPU wheel
        env:
          RFX_CPU_ONLY: '1'
        run: pip wheel . --no-deps -w wheelhouse/

      - name: Repair wheel
        run: |
          New-Item -ItemType Directory -Force -Path dist
          foreach ($whl in Get-ChildItem wheelhouse/*.whl) {
            try {
              delvewheel repair $whl.FullName -w dist/
            } catch {
              Copy-Item $whl.FullName dist/
            }
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-cpu-py${{ matrix.python-version }}
          path: dist/*.whl

  # ============================================================
  # macOS CPU wheels (Apple Silicon)
  # ============================================================
  macos-arm:
    name: macOS ARM CPU - Python ${{ matrix.python-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: brew install libomp openblas lapack

      - name: Install Python build tools
        run: pip install --upgrade pip setuptools wheel pybind11 numpy cmake delocate

      - name: Build CPU wheel
        env:
          RFX_CPU_ONLY: '1'
          OpenMP_ROOT: /opt/homebrew/opt/libomp
        run: pip wheel . --no-deps -w wheelhouse/

      - name: Repair wheel
        run: |
          mkdir -p dist/
          for whl in wheelhouse/*.whl; do
            delocate-wheel -v -w dist/ "$whl" || cp "$whl" dist/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm-cpu-py${{ matrix.python-version }}
          path: dist/*.whl

  # ============================================================
  # Source distribution
  # ============================================================
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install --upgrade pip setuptools build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ============================================================
  # Upload to PyPI / TestPyPI
  # ============================================================
  upload:
    name: Upload wheels
    needs: [linux-gpu, linux-cpu, windows-gpu, windows-cpu, macos-arm, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload to TestPyPI
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_target == 'testpypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload to PyPI
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
